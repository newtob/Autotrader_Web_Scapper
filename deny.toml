# cargo-deny policy. Run `just rust-deny` locally; CI runs it via EmbarkStudios/cargo-deny-action.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Vercel runs Linux; developers run macOS. Only check what actually builds for those.
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[advisories]
# RustSec advisories. Unmaintained/unsound crates in the tree are reported too.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
# This crate is `publish = false` and carries no license field.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Unlicense",
]

[bans]
# Duplicate versions are common in async stacks; surface them without failing the build.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
