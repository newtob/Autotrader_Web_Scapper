[package]
name = "autotrader-prices-api"
version = "0.1.0"
edition = "2024"
publish = false
license = "PolyForm-Strict-1.0.0"
autotests = false

[lib]
name = "prices_api"
path = "api-rs/src/lib.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["limit", "load-shed"] }
tower-http = { version = "0.7.1", default-features = false, features = ["request-id", "timeout", "trace"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "json"] }
url = "2.5.8"
vercel_runtime = { version = "2.4.1", features = ["axum"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

# One Vercel function serves every /api/* route through the Axum router in the `prices_api`
# library (api-rs/); vercel.json rewrites /api/* to it.
[[bin]]
name = "index"
path = "api/index.rs"

[[test]]
name = "db_integration"
path = "api-rs/tests/db_integration.rs"

[[test]]
name = "http"
path = "api-rs/tests/http.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
